name: Refresh YouTube view stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 1 * *"

permissions:
  contents: read

jobs:
  refresh-video-stats:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Refresh featured video stats
        run: python scripts/refresh_youtube_video_stats.py --video-id RxHTaTmPlwQ

      - name: Commit refreshed video stats
        run: |
          if git diff --quiet -- assets/data/youtube-video-stats.json github-flat/assets/data/youtube-video-stats.json; then
            echo "No video stat changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube-video-stats.json github-flat/assets/data/youtube-video-stats.json
          git commit -m "chore: refresh featured video view stats"
          git push
