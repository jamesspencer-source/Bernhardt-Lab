name: Check Envelope Escape leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 1"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check leaderboard worker
        run: python scripts/check_leaderboard_worker.py
