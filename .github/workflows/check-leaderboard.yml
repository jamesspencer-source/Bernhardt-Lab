name: Check Envelope Escape leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "45 12 * * 1"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check leaderboard worker
        run: python scripts/check_leaderboard_worker.py
