name: Apply scheduled website updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  apply-scheduled-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply due scheduled updates
        run: python3 scripts/apply_scheduled_updates.py

      - name: Detect due changes
        id: changes
        run: |
          if git diff --quiet -- data/people.json data/scheduled-updates.json; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.due == 'true'
        with:
          node-version: "24"

      - name: Install browser test tools
        if: steps.changes.outputs.due == 'true'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Validate and publish exact scheduled updates
        if: steps.changes.outputs.due == 'true'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publish_site.py --include data/people.json data/scheduled-updates.json --message "site: apply scheduled website updates"
