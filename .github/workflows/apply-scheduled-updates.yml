name: Apply scheduled website updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  apply-scheduled-updates:
    permissions:
      contents: write
      actions: write
      pages: write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Apply due scheduled updates
        run: python3 scripts/apply_scheduled_updates.py

      - name: Detect due changes
        id: changes
        run: |
          if git diff --quiet -- data/people.json data/scheduled-updates.json; then
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.due == 'true'
        with:
          node-version: "24"

      - name: Install browser test tools
        if: steps.changes.outputs.due == 'true'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Validate and publish exact scheduled updates
        if: steps.changes.outputs.due == 'true'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publish_site.py --include data/people.json data/scheduled-updates.json --message "site: apply scheduled website updates"
